<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កំណត់លេខសម្ងាត់ឡើងវិញ - NSP POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f0f2f5; --card-bg: #ffffff; --text-color: #333333; --input-border: #dddddd; --label-color: #555555; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --card-bg: #2d2d2d; --text-color: #e0e0e0; --input-border: #444444; --label-color: #bbbbbb; }
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: var(--bg-color); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-color); transition: background 0.3s, color 0.3s; }
        .reset-card { background: var(--card-bg); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 420px; box-sizing: border-box; text-align: center; }
        h1 { font-family: 'Moul', serif; font-size: 18px; color: #d81b60; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--label-color); font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--input-border); border-radius: 10px; box-sizing: border-box; font-size: 16px; background: var(--bg-color); color: var(--text-color); }
        .btn-reset { width: 100%; padding: 14px; background: #d81b60; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-reset:hover { background: #ad144b; }
        .back-link { display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #d81b60; text-decoration: underline; }
        .msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        .error { background: #ffebee; color: #d32f2f; border: 1px solid #ffcdd2; }
        .success { background: #f8bbd0; color: #d81b60; border: 1px solid #f48fb1; }
    </style>
</head>
<body id="body">
<script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') document.body.setAttribute('data-theme', 'dark');
</script>
<div class="reset-card">
    <h1>កំណត់លេខសម្ងាត់ឡើងវិញ</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="msg {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <!-- SECURITY: CSRF token for form submission -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="form-group">
            <label>ឈ្មោះអ្នកប្រើប្រាស់ (Username)</label>
            <input type="text" name="username" placeholder="ឧទាហរណ៍: admin" required autofocus>
        </div>
        <div class="form-group">
            <label>លេខកូដសម្ងាត់សម្រាប់សង្គ្រោះ (Recovery PIN)</label>
            <input type="password" name="pin" required placeholder="បញ្ចូលលេខកូដ ៦ ខ្ទង់">
        </div>
        <div class="form-group">
            <label>លេខសម្ងាត់ថ្មី (New Password)</label>
            <input type="password" name="new_password" required placeholder="បញ្ចូលលេខសម្ងាត់ថ្មី">
        </div>
        <button type="submit" class="btn-reset">ផ្លាស់ប្តូរលេខសម្ងាត់ | Reset Password</button>
    </form>
    <a href="{{ url_for('login') }}" class="back-link">← ត្រឡប់ទៅទំព័រចូលប្រើប្រាស់</a>
</div>
</body>
</html>
