<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ចូលប្រើប្រព័ន្ធ - NSP POS</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}?v=4">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicon-16.png') }}?v=4">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}?v=4">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/luxury.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --bg-color: #f4f7f6; --card-bg: #ffffff; --text-color: #333333; --input-border: #dddddd; --label-color: #555555; --primary-color: #d81b60; }
        [data-theme="dark"] { --bg-color: #1a1a1a; --card-bg: #2d2d2d; --text-color: #e0e0e0; --input-border: #444444; --label-color: #bbbbbb; }
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: var(--bg-color); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: var(--text-color); }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; border: 4px solid var(--bg-color); }
        h1, h2 { font-family: 'Moul', serif; font-size: 18px; color: var(--primary-color); margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 20px; position: relative; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--label-color); font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--input-border); border-radius: 10px; box-sizing: border-box; font-size: 16px; background: var(--bg-color); color: var(--text-color); font-family: 'Kantumruy Pro', sans-serif; }
        .toggle-password { position: absolute; right: 12px; top: 38px; cursor: pointer; }
        .hint-text { font-size: 11px; color: #888; margin-top: 5px; font-style: italic; }
    </style>
</head>
<body>

<div class="login-card">
    <!-- SECURITY: CSRF token for AJAX requests -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <img src="/static/images/nsp_logo.png" class="logo-img" onerror="this.src='/static/images/default.jpg'">
    <h2 id="authTitle">ចូលប្រើប្រព័ន្ធ POS</h2>

    <div class="form-group">
        <label>អ៊ីមែល ឬ លេខទូរស័ព្ទ (Email or Phone Number)</label>
        <input type="text" id="username" placeholder="ឧទាហរណ៍: 012345678" autofocus>
        <div class="hint-text">ជំនួយ: ប្រើ 'admin' សម្រាប់ការចូលលើកដំបូង</div>
    </div>

    <div class="form-group">
        <label>លេខសម្ងាត់ (Password)</label>
        <input type="password" id="password" placeholder="បញ្ចូលលេខសម្ងាត់">
        <span class="toggle-password" onclick="togglePassword()">👁</span>
        <div class="hint-text">ជំនួយ: ប្រើ 'admin123' សម្រាប់ការចូលលើកដំបូង</div>
    </div>

    <div id="confirmPasswordGroup" class="form-group" style="display: none;">
        <label>បញ្ជាក់លេខសម្ងាត់ (Confirm Password)</label>
        <input type="password" id="confirmPassword" placeholder="បញ្ជាក់លេខសម្ងាត់">
    </div>

    <button type="button" id="authBtn" onclick="handleAuth()" style="width: 100%; background: #1a472a; color: white; padding: 14px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; font-family: 'Kantumruy Pro', sans-serif;">
        ចូលប្រព័ន្ធ | Login
    </button>
    
    <div style="margin-top: 20px; font-size: 13px;">
        <p id="toggleText">មិនទាន់មានគណនី? <a href="javascript:void(0)" onclick="toggleAuthMode()" style="color: var(--primary-color); font-weight: bold; text-decoration: none;">ចុះឈ្មោះទីនេះ | Sign Up</a></p>
        <a href="/forgot-password" style="color: #888; text-decoration: none;">ភ្លេចលេខសម្ងាត់? | Forgot Password?</a>
    </div>

    <p style="margin-top: 25px; font-size: 12px; color: #999;">&copy; 2026 NSP Cosmetic Store</p>
</div>

<script>
    // មុខងារបន្ថែម៖ ភ្ជាប់ប៊ូតុង Enter លើប្រអប់វាយអក្សរទាំងអស់ឱ្យហៅការ Login
    window.onload = function() {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleAuth();
                }
            });
        });
    };

    function togglePassword() {
        const passField = document.getElementById('password');
        const toggleIcon = document.querySelector('.toggle-password');
        if (passField.type === 'password') { 
            passField.type = 'text'; 
            toggleIcon.innerText = '🔒'; 
        } else { 
            passField.type = 'password'; 
            toggleIcon.innerText = '👁'; 
        }
    }

    let isSignUpMode = false;

    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        const authBtn = document.getElementById('authBtn');
        const toggleLink = document.getElementById('toggleText');
        const confirmField = document.getElementById('confirmPasswordGroup');
        const title = document.getElementById('authTitle');

        if (isSignUpMode) {
            title.innerText = "ចុះឈ្មោះអ្នកប្រើប្រាស់ថ្មី";
            authBtn.innerText = "ចុះឈ្មោះ | Sign Up";
            authBtn.style.background = "#d81b60"; // Change color to indicate Signup
            confirmField.style.display = "block";
            toggleLink.innerHTML = 'មានគណនីរួចហើយ? <a href="javascript:void(0)" onclick="toggleAuthMode()" style="color: #1a472a; font-weight: bold;">ចូលប្រើវិញ | Login</a>';
        } else {
            title.innerText = "ចូលប្រើប្រព័ន្ធ POS";
            authBtn.innerText = "ចូលប្រព័ន្ធ | Login";
            authBtn.style.background = "#1a472a";
            confirmField.style.display = "none";
            toggleLink.innerHTML = 'មិនទាន់មានគណនី? <a href="javascript:void(0)" onclick="toggleAuthMode()" style="color: #d81b60; font-weight: bold;">ចុះឈ្មោះទីនេះ | Sign Up</a>';
        }
    }

    async function handleAuth() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        
        const route = isSignUpMode ? '/signup' : '/login';

        if (isSignUpMode) {
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (password !== confirmPassword) {
                return Swal.fire('បរាជ័យ', 'លេខសម្ងាត់មិនដូចគ្នាទេ!', 'error');
            }
        }

        if (!username || !password) {
            return Swal.fire('បរាជ័យ', 'សូមបំពេញឈ្មោះ និងលេខសម្ងាត់!', 'warning');
        }

        Swal.showLoading();

        try {
            // SECURITY: Include CSRF token in headers
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            
            const response = await fetch(route, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ username, password })
            });

            // Check if response is JSON
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const text = await response.text();
                console.error("Non-JSON response:", text);
                throw new Error("Server returned non-JSON response");
            }

            const result = await response.json();

            if (result.status === 'success') {
                if (isSignUpMode) {
                    Swal.fire('ជោគជ័យ', 'គណនីត្រូវបានបង្កើត! សូមចូលប្រើប្រាស់។', 'success')
                    .then(() => toggleAuthMode());
                } else {
                    window.location.href = '/'; 
                }
            } else {
                Swal.fire('បរាជ័យ', result.message || 'ព័ត៌មានមិនត្រឹមត្រូវ', 'error');
            }
        } catch (error) {
            Swal.fire('Error', 'មានបញ្ហាតំណភ្ជាប់ទៅ Server!', 'error');
        }
    }
</script>
</body>
</html>
